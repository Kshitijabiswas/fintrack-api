spring:
  application:
    name: fintrack
  datasource:
    url: jdbc:postgresql://postgres:5432/fintrackdb
    username: postgres
    password: your_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # use 'validate' or 'none' in production
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  file:
    name: logs/fintrack.log
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate: ERROR
